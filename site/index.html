<body class="gatepage">
<div class="vign"></div>
<main class="gate fr">
  <i class="nd tl"></i><i class="nd tr"></i><i class="nd bl"></i><i class="nd br"></i>
  <div class="gate-id"><div class="logo">L9</div><div class="ttl">로드나인 캐릭터 추적기</div></div>
  <form id="gateForm" autocomplete="off">
    <label for="pin" class="gate-lbl">입장 비밀번호</label>
    <input id="pin" class="gate-pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="12" autocomplete="current-password" required autofocus>
    <label class="gate-keep"><input type="checkbox" id="keep"> 이 기기에서 로그인 유지</label>
    <button class="btn pri gate-go" id="go" type="submit">입장</button>
    <div class="gate-msg" id="msg" role="status" aria-live="polite"></div>
  </form>
  <div class="gate-note">비밀번호는 관리자가 바꿀 수 있습니다. 바뀌면 다시 입력해야 합니다.</div>
</main>
