# 로드나인 추적기 — 매일 12:05(한국시간) 전체 캐릭터 수집 후 웹사이트 갱신
# 사이트 갱신이 늦은 날을 대비해 12:35 · 13:05 · 14:05 에도 확인 (이미 수집했으면 바로 끝남)
# 새벽 05:00 에도 한 번 더 확인 (전날 수집이 실패했으면 이때 다시 수집)
name: 데이터 갱신

on:
  schedule:
    - cron: "5 3 * * *"       # UTC 03:05 = 한국시간 12:05
    - cron: "35 3 * * *"      # 12:35 재확인
    - cron: "5 4 * * *"       # 13:05 재확인
    - cron: "5 5 * * *"       # 14:05 재확인
    - cron: "0 20 * * *"      # UTC 20:00 = 한국시간 새벽 05:00
  workflow_dispatch:           # Actions 화면에서 [Run workflow]로 바로 실행
    inputs:
      force:
        description: "이미 수집한 날이어도 다시 수집"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["site/**", "crawler.py", "seal.py", ".github/workflows/update.yml"]   # 파일을 새로 올리면 수집 없이 다시 배포

# 최상위 권한은 읽기만 — 잡마다 필요한 것만 따로 부여
permissions:
  contents: read

# 수동 실행(비밀번호 변경용)이 예약 실행의 대기열에 밀려 취소되지 않도록 실행 종류별로 묶음
concurrency:
  group: pages-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'auto' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write      # 예약 실행 유지용 커밋(keepalive)에만 사용
    outputs:
      status: ${{ steps.crawl.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false     # 토큰이 .git 설정에 남지 않게 (필요한 단계에서만 직접 사용)
      # 평문 데이터가 공개 저장소에 올라가 있으면 누구나 볼 수 있으므로 멈춤
      - name: 평문 데이터 폴더 확인
        run: |
          if [ -d data ] || [ -d site/data ]; then echo "::error::평문 데이터가 공개 저장소에 있습니다 — 지우고 다시 실행하세요"; exit 1; fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests cryptography
      # 입장 비밀번호 · 관리용 키가 없으면 데이터가 잠기지 않은 채 배포되지 않도록 여기서 멈춤
      - name: 비밀번호 설정 확인
        env:
          L9_PASS: ${{ secrets.L9_PASS }}
          L9_KEY: ${{ secrets.L9_KEY }}
        run: |
          if [ -z "$L9_PASS" ] || [ -z "$L9_KEY" ]; then echo "::error::GitHub Secrets 에 L9_PASS(입장 비밀번호) 와 L9_KEY(관리용 키)를 넣으세요"; exit 1; fi
          if [ "${#L9_KEY}" -lt 32 ]; then echo "::error::L9_KEY 는 32자 이상이어야 합니다 (openssl rand -hex 24 같은 무작위 값)"; exit 1; fi
          if ! printf '%s' "$L9_PASS" | grep -Eq '^[0-9]{4,12}$'; then echo "::error::L9_PASS 는 숫자 4~12자리여야 합니다"; exit 1; fi
      - id: pages
        uses: actions/configure-pages@v5
      - name: 수집
        id: crawl
        env:
          L9_KEY: ${{ secrets.L9_KEY }}
          FORCE: ${{ inputs.force }}
          EVENT: ${{ github.event_name }}
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          ARGS=""
          if [ "$EVENT" = "push" ]; then ARGS="--no-crawl"; fi
          if [ "$FORCE" = "true" ]; then ARGS="$ARGS --force"; fi
          python crawler.py --out public --site site --prev "$BASE_URL/" $ARGS
          # 직접 실행(Run workflow)인데 새로 모을 데이터가 없으면 → 지금 데이터를 새 비밀번호로 다시 잠가 배포 (비밀번호 변경용)
          ST="$(cat public/.status)"
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$ST" != "done" ] && [ "$ST" != "copied" ] && [ "$ST" != "error" ]; then
            python crawler.py --out public --site site --prev "$BASE_URL/" --no-crawl
          fi
          echo "status=$(cat public/.status)" >> "$GITHUB_OUTPUT"
      # 배포 전에 데이터 파일 암호화 (비밀번호를 바꿨으면 [Run workflow] 한 번으로 새 비밀번호 적용)
      - name: 데이터 잠금
        if: steps.crawl.outputs.status == 'done' || steps.crawl.outputs.status == 'copied'
        env:
          L9_PASS: ${{ secrets.L9_PASS }}
          L9_KEY: ${{ secrets.L9_KEY }}
        run: python seal.py public
      # 새로 수집한 데이터가 없으면(이미 최신 / 사이트 갱신 전) 배포하지 않음
      - if: steps.crawl.outputs.status == 'done' || steps.crawl.outputs.status == 'copied'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      # 60일 동안 저장소에 변화가 없으면 GitHub가 예약 실행을 멈추므로, 한 달에 한 번 기록을 남김
      - name: 예약 실행 유지
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$(date -u +%d)" = "01" ] && [ "$(date -u +%H)" = "03" ]; then
            date -u > .keepalive
            git config user.name "l9tracker-bot"
            git config user.email "l9tracker-bot@users.noreply.github.com"
            git add .keepalive && git commit -m "keepalive" && git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:main || true
          fi

  deploy:
    needs: build
    if: needs.build.outputs.status == 'done' || needs.build.outputs.status == 'copied'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
